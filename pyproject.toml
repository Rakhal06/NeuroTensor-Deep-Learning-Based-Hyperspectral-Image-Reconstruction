[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deeptensor"
version = "1.0.0"
description = "DeepTensor++: Deep Matrix and Tensor Factorization with Deep Network Priors"
readme = "README.md"
authors = [
    { name = "Rakhal Krishna", email = "b.rakhalkrishna06@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "torchvision",
    "torchaudio",
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "scikit-image>=0.19.0",
    "matplotlib>=3.4.0",
    "tqdm>=4.60.0",
    "opencv-python",
    "tensorly>=0.7.0",
    "scikit-learn>=1.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black",
    "flake8",
]
demo = [
    "streamlit>=1.20.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["deeptensor*"]

